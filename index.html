<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">

        <!-- Some update -->
        <header class="header">
            <h1>Hello Adam, welcome to your todo list!</h1>
            <p id="items-left">0 items left</p>
        </header>

        <form class="add-form" id="add-form">
            <input
                type="text"
                id="todo-input"
                placeholder="What needs to be done?"
                autocomplete="off"
                maxlength="200"
            >
            <button type="submit" class="btn btn-add">Add</button>
        </form>

        <nav class="filters" aria-label="Filter todos">
            <button type="button" class="filter-btn is-active" data-filter="all">All</button>
            <button type="button" class="filter-btn" data-filter="active">Active</button>
            <button type="button" class="filter-btn" data-filter="completed">Done</button>
        </nav>

        <ul class="todo-list" id="todo-list"></ul>

        <footer class="footer">
            <span id="total-count">0 total</span>
            <button type="button" class="btn-clear" id="clear-completed" disabled>
                Clear completed
            </button>
        </footer>
    </div>

    <script>
        const STORAGE_KEY = "todo-list-items";
        const FILTER_ALL = "all";
        const FILTER_ACTIVE = "active";
        const FILTER_COMPLETED = "completed";

        let todos = [];
        let currentFilter = FILTER_ALL;

        const addForm = document.getElementById("add-form");
        const todoInput = document.getElementById("todo-input");
        const todoList = document.getElementById("todo-list");
        const itemsLeftEl = document.getElementById("items-left");
        const totalCountEl = document.getElementById("total-count");
        const clearCompletedBtn = document.getElementById("clear-completed");
        const filterButtons = document.querySelectorAll(".filter-btn");

        function loadTodos() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                todos = stored ? JSON.parse(stored) : [];
            } catch {
                todos = [];
            }
        }

        function saveTodos() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
        }

        function createId() {
            return crypto.randomUUID();
        }

        function getActiveCount() {
            return todos.filter((todo) => !todo.isCompleted).length;
        }

        function getCompletedCount() {
            return todos.filter((todo) => todo.isCompleted).length;
        }

        function getFilteredTodos() {
            if (currentFilter === FILTER_ACTIVE) {
                return todos.filter((todo) => !todo.isCompleted);
            }
            if (currentFilter === FILTER_COMPLETED) {
                return todos.filter((todo) => todo.isCompleted);
            }
            return todos;
        }

        function updateFooter() {
            const activeCount = getActiveCount();
            const label = activeCount === 1 ? "item" : "items";
            itemsLeftEl.textContent = `${activeCount} ${label} left`;
            totalCountEl.textContent = `${todos.length} total`;
            clearCompletedBtn.disabled = getCompletedCount() === 0;
        }

        function createEmptyState() {
            const empty = document.createElement("li");
            empty.className = "empty-state";
            const messages = {
                [FILTER_ALL]: ["No todos yet.", "✨"],
                [FILTER_ACTIVE]: ["All caught up!", "🎉"],
                [FILTER_COMPLETED]: ["Nothing completed yet.", "📋"],
            };
            const [text, icon] = messages[currentFilter];
            empty.innerHTML = `${text}<span>${icon}</span>`;
            return empty;
        }

        function createTodoElement(todo) {
            const item = document.createElement("li");
            item.className = "todo-item";
            item.dataset.id = todo.id;
            if (todo.isCompleted) {
                item.classList.add("is-completed");
            }

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.className = "todo-checkbox";
            checkbox.checked = todo.isCompleted;
            checkbox.setAttribute("aria-label", `Mark "${todo.text}" as complete`);

            const text = document.createElement("span");
            text.className = "todo-text";
            text.textContent = todo.text;

            const deleteBtn = document.createElement("button");
            deleteBtn.type = "button";
            deleteBtn.className = "btn btn-delete";
            deleteBtn.textContent = "Delete";

            item.append(checkbox, text, deleteBtn);
            return item;
        }

        function renderTodos() {
            todoList.replaceChildren();
            const filtered = getFilteredTodos();

            if (filtered.length === 0) {
                todoList.append(createEmptyState());
            } else {
                filtered.forEach((todo) => {
                    todoList.append(createTodoElement(todo));
                });
            }

            updateFooter();
        }

        function addTodo(text) {
            const trimmed = text.trim();
            if (!trimmed) {
                return;
            }

            todos.unshift({
                id: createId(),
                text: trimmed,
                isCompleted: false,
            });

            saveTodos();
            renderTodos();
        }

        function toggleTodo(id) {
            const todo = todos.find((item) => item.id === id);
            if (!todo) {
                return;
            }

            todo.isCompleted = !todo.isCompleted;
            saveTodos();
            renderTodos();
        }

        function deleteTodo(id) {
            todos = todos.filter((item) => item.id !== id);
            saveTodos();
            renderTodos();
        }

        function clearCompleted() {
            todos = todos.filter((item) => !item.isCompleted);
            saveTodos();
            renderTodos();
        }

        function setFilter(filter) {
            currentFilter = filter;
            filterButtons.forEach((btn) => {
                btn.classList.toggle("is-active", btn.dataset.filter === filter);
            });
            renderTodos();
        }

        function findTodoId(target) {
            const item = target.closest(".todo-item");
            return item ? item.dataset.id : null;
        }

        addForm.addEventListener("submit", (event) => {
            event.preventDefault();
            addTodo(todoInput.value);
            todoInput.value = "";
            todoInput.focus();
        });

        todoList.addEventListener("change", (event) => {
            if (!event.target.classList.contains("todo-checkbox")) {
                return;
            }
            const id = findTodoId(event.target);
            if (id) {
                toggleTodo(id);
            }
        });

        todoList.addEventListener("click", (event) => {
            if (!event.target.classList.contains("btn-delete")) {
                return;
            }
            const id = findTodoId(event.target);
            if (id) {
                deleteTodo(id);
            }
        });

        filterButtons.forEach((btn) => {
            btn.addEventListener("click", () => setFilter(btn.dataset.filter));
        });

        clearCompletedBtn.addEventListener("click", clearCompleted);

        loadTodos();
        renderTodos();
        todoInput.focus();
    </script>
</body>
</html>
