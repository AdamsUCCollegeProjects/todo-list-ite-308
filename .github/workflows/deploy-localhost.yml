name: Deploy to localhost

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to localhost
        env:
          PULL_BEFORE_BUILD: "0"
        run: |
          chmod +x scripts/deploy-local.sh
          ./scripts/deploy-local.sh
